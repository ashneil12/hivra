name: Worker builds and dependency evidence

on:
  push:
    branches: [main]
    paths:
      - '.gitleaks.toml'
      - '.gitleaksignore'
      - '.agents/product-marketing-context.md'
      - '.agents/skills/**'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'README.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'
      - 'THIRD_PARTY_LICENSES/**'
      - 'TRADEMARKS.md'
      - 'contracts/LICENSE'
      - 'contracts/**/*.sol'
      - 'dashboard/package.json'
      - 'dashboard/package-lock.json'
      - 'docs/OPEN-SOURCE-BOUNDARY.md'
      - 'docs/SECURITY-MODEL.md'
      - 'docs/release/**'
      - 'services/browser-sidecar/package.json'
      - 'services/browser-sidecar/package-lock.json'
      - 'services/posthog-proxy-worker/**'
      - 'services/venice-proxy-worker/**'
      - 'scripts/release/**'
      - '.github/workflows/worker-builds.yml'
      - '.github/workflows/public-release-safety.yml'
  pull_request:
    paths:
      - '.gitleaks.toml'
      - '.gitleaksignore'
      - '.agents/product-marketing-context.md'
      - '.agents/skills/**'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'README.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'
      - 'THIRD_PARTY_LICENSES/**'
      - 'TRADEMARKS.md'
      - 'contracts/LICENSE'
      - 'contracts/**/*.sol'
      - 'dashboard/package.json'
      - 'dashboard/package-lock.json'
      - 'docs/OPEN-SOURCE-BOUNDARY.md'
      - 'docs/SECURITY-MODEL.md'
      - 'docs/release/**'
      - 'services/browser-sidecar/package.json'
      - 'services/browser-sidecar/package-lock.json'
      - 'services/posthog-proxy-worker/**'
      - 'services/venice-proxy-worker/**'
      - 'scripts/release/**'
      - '.github/workflows/worker-builds.yml'
      - '.github/workflows/public-release-safety.yml'

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: [posthog-proxy-worker, venice-proxy-worker]
    defaults:
      run:
        working-directory: services/${{ matrix.worker }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      # Local bundling only: no Cloudflare account, token, upload or deployment.
      - run: npm run build
      - run: npm test

  inventory-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node --test --test-timeout=15000 scripts/release/asset-provenance-evidence.test.mjs scripts/release/credential-reconciliation-evidence.test.mjs scripts/release/dependency-inventory.test.mjs scripts/release/notice-source-offer-evidence.test.mjs scripts/release/public-release-metadata.test.mjs scripts/release/public-source-approval.test.mjs scripts/release/public-source-candidate.test.mjs scripts/release/public-tree-hygiene.test.mjs scripts/release/runtime-distribution-boundary.test.mjs scripts/release/source-third-party-provenance.test.mjs scripts/release/worker-test-harness.test.mjs dashboard/scripts/test-public-source-bootstrap-e2e.test.mjs dashboard/scripts/test-self-host-recovery-e2e.test.mjs
