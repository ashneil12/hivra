name: Dashboard CI

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'docker-compose.yml'
      # Workflow-only changes still report the same public verification check.
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel an obsolete run when a newer commit lands on the same PR or branch.
concurrency:
  group: dashboard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-dashboard:
    name: Verify Dashboard
    runs-on: ubuntu-latest
    # The full suite alone takes ~15 min on a hosted runner (2026-09-24), so 20
    # cancelled green runs during the build that follows it.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Determine migration diff range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "MIGRATION_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "MIGRATION_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            # A manual dispatch has no meaningful PR change-set. Verify the
            # current tree and give diff-only guards an empty range.
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BEFORE_SHA="${{ github.sha }}"
            fi
            echo "MIGRATION_BASE_SHA=$BEFORE_SHA" >> "$GITHUB_ENV"
            echo "MIGRATION_HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Enforce append-only Supabase migrations
        run: node scripts/check-supabase-migration-hygiene.cjs --base "$MIGRATION_BASE_SHA" --head "$MIGRATION_HEAD_SHA"

      - name: Enforce hot-surface regression coverage
        run: npm run guard:hot-surfaces -- --base "$MIGRATION_BASE_SHA" --head "$MIGRATION_HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      # Browser regression suites (recovery-control styles, desktop handoff)
      # launch headless Chromium; the runner image does not ship Playwright's
      # pinned build, so install exactly the version in package-lock.json.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # Execute the generated config-repair Python rather than asserting only
      # string fragments. Debian's system Python may lack ensurepip/python-venv;
      # use a managed interpreter without changing packages on the shared runner.
      - name: Setup isolated Python tooling
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (Node 24)
        with:
          version: "0.11.2"
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/hermes-test-uv-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare terminal config behavioral tests
        shell: bash
        run: |
          HERMES_CONFIG_TEST_VENV="$RUNNER_TEMP/hermes-config-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/hermes-test-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export UV_CACHE_DIR="$RUNNER_TEMP/hermes-test-uv-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          uv venv --managed-python --python 3.12.13 "$HERMES_CONFIG_TEST_VENV"
          uv pip install --python "$HERMES_CONFIG_TEST_VENV/bin/python" PyYAML==6.0.3
          echo "HERMES_CONFIG_TEST_PYTHON=$HERMES_CONFIG_TEST_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Run deployment and contract smoke suite
        run: npm run test:smoke-contracts

      - name: Run hot path regression suite
        run: npm run test:hot-paths

      - name: Verify dashboard
        run: npm run verify

      - name: Verify public dashboard artifact boundary
        run: npm run verify:public-artifact

  # The attach helpers need root, mounts and a real kernel (idmapped mounts on
  # tmpfs need 6.3 or later; ubuntu-latest has 6.8), so they run in owned,
  # disposable containers on the runner, never on a real computer. The host
  # step test runs the exact scripts Hivra generates against a fake qm.
  attach-fixtures:
    name: Attach host and guest fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    env:
      PYTHON_IMAGE: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
      DEBIAN_IMAGE: node:22-bookworm@sha256:dd5847a04b0deee391fa145f1f4c6d214196668b6bcc7988ebed67249f226844

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Attached network filter rendering (T5, T36, T37)
        run: python3 -I -B scripts/test-attached-network-sets.py

      - name: Attached DNS relay (T36)
        run: docker run --rm --network none -v "$PWD":/src:ro "$PYTHON_IMAGE" python3 /src/scripts/test-attached-dns-relay.py

      - name: Attached workspace helper and the Remove walker (T4, T10, T23, T31)
        run: docker run --rm --network none --privileged --tmpfs /home --tmpfs /var/lib/hivra -v "$PWD":/src:ro "$PYTHON_IMAGE" python3 /src/scripts/test-attached-workspace-helper.py

      - name: Attached contract read-back (T33)
        run: docker run --rm --network none --privileged -v "$PWD":/src:ro "$PYTHON_IMAGE" python3 /src/scripts/test-attached-contract-readback.py

      - name: Host allocation lock program
        run: docker run --rm --network none -v "$PWD/src/lib/agent-computers/attachment-host-observation.ts":/tmp/attachment-host-observation.ts:ro -v "$PWD/scripts":/scripts:ro "$DEBIAN_IMAGE" python3 -I -B /scripts/test-attachment-host-lock.py

      - name: Install dependencies
        run: npm ci

      - name: Attach host steps release the host lock while the guest works (T3, T25)
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/host-step-fixture"
          HIVRA_HOST_STEP_FIXTURE_DIR="$fixture" npx jest --ci src/lib/agent-computers/__tests__/attachment-host-step.test.ts
          test -s "$fixture/step-ok.sh"
          docker run --rm --network none -v "$PWD/scripts":/scripts:ro -v "$fixture":/fixture:ro "$DEBIAN_IMAGE" python3 -I -B /scripts/test-attachment-host-step.py
