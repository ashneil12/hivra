name: Dashboard CI

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'docker-compose.yml'
      # Workflow-only changes still report the same public verification check.
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel an obsolete run when a newer commit lands on the same PR or branch.
concurrency:
  group: dashboard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# `npm run verify` (lint, typecheck, jest, build) ran as one serial job and hit
# 20 minutes on 2026-09-24, 16 of them in `jest --runInBand`. The same work now
# runs as parallel jobs, with jest split into duration-balanced shards
# (dashboard/scripts/jest-duration-sequencer.cjs). "Verify Dashboard" is the
# aggregate check and passes only when every job below passed.
jobs:
  static-checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Determine migration diff range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "MIGRATION_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "MIGRATION_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            # A manual dispatch has no meaningful PR change-set. Verify the
            # current tree and give diff-only guards an empty range.
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BEFORE_SHA="${{ github.sha }}"
            fi
            echo "MIGRATION_BASE_SHA=$BEFORE_SHA" >> "$GITHUB_ENV"
            echo "MIGRATION_HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Enforce append-only Supabase migrations
        run: node scripts/check-supabase-migration-hygiene.cjs --base "$MIGRATION_BASE_SHA" --head "$MIGRATION_HEAD_SHA"

      - name: Enforce hot-surface regression coverage
        run: npm run guard:hot-surfaces -- --base "$MIGRATION_BASE_SHA" --head "$MIGRATION_HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  jest:
    name: Jest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # A shard takes about 4 minutes of jest plus 1-2 minutes of setup.
    timeout-minutes: 15
    strategy:
      # Report every failing shard, not just the first one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Browser regression suites (recovery-control styles, desktop handoff)
      # launch headless Chromium; the runner image does not ship Playwright's
      # pinned build, so install exactly the version in package-lock.json.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # Execute the generated config-repair Python rather than asserting only
      # string fragments. Debian's system Python may lack ensurepip/python-venv;
      # use a managed interpreter without changing packages on the shared runner.
      - name: Setup isolated Python tooling
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (Node 24)
        with:
          version: "0.11.2"
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/hermes-test-uv-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare terminal config behavioral tests
        shell: bash
        run: |
          HERMES_CONFIG_TEST_VENV="$RUNNER_TEMP/hermes-config-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/hermes-test-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export UV_CACHE_DIR="$RUNNER_TEMP/hermes-test-uv-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          uv venv --managed-python --python 3.12.13 "$HERMES_CONFIG_TEST_VENV"
          uv pip install --python "$HERMES_CONFIG_TEST_VENV/bin/python" PyYAML==6.0.3
          echo "HERMES_CONFIG_TEST_PYTHON=$HERMES_CONFIG_TEST_VENV/bin/python" >> "$GITHUB_ENV"

      # The smoke-contract and hot-path suites are part of every shard's
      # selection, so they are not run a second time here.
      - name: Run jest shard
        run: npm run test:ci -- --shard=${{ matrix.shard }}/4

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify public dashboard artifact boundary
        run: npm run verify:public-artifact

  verify-dashboard:
    name: Verify Dashboard
    needs: [static-checks, jest, build]
    # Always report, so a failed or cancelled job fails this check instead of
    # leaving it skipped.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every dashboard job to pass
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$failed" ]; then
            echo "::error::Dashboard verification failed: $failed"
            exit 1
          fi
