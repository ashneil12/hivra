name: Windows app

# Tests and builds Hivra for Windows (apps/desktop/HivraDesktop, Tauri) on a
# Windows runner and keeps the unsigned installer as a run artifact. Nothing
# is published from here: a public release needs Windows code signing first.

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/windows-app.yml'
  push:
    branches: [canary]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:
    inputs:
      connection:
        description: 'Website the build opens (blank = https://hivra.cloud/dashboard)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop/HivraDesktop/src-tauri
    env:
      CARGO_TERM_COLOR: always
      HIVRA_DESKTOP_CONNECTION: ${{ inputs.connection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Unit tests
        run: cargo test --locked
      - name: Build the installer
        shell: bash
        run: |
          if [ -z "$HIVRA_DESKTOP_CONNECTION" ]; then unset HIVRA_DESKTOP_CONNECTION; fi
          npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis
      - name: Smoke-test the installed shell
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          $installDir = Join-Path $env:RUNNER_TEMP "hivra-installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -PassThru -NoNewWindow
          if (-not $install.WaitForExit(120000)) {
            $install.Kill($true)
            throw "Windows installer did not finish within 120 seconds"
          }
          if ($install.ExitCode -ne 0) { throw "Windows installer failed with exit code $($install.ExitCode)" }
          $application = Get-ChildItem $installDir -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -notmatch '^uninstall' } |
            Select-Object -First 1
          if (-not $application) { throw "Installed Hivra executable was not found" }
          Write-Host "Installed executable: $($application.FullName)"
          $process = Start-Process -FilePath $application.FullName -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) { throw "Hivra exited during startup with code $($process.ExitCode)" }
          $command = (Get-ItemProperty -Path "HKCU:\Software\Classes\hivra\shell\open\command" -ErrorAction Stop).'(default)'
          if (-not $command.ToLowerInvariant().Contains($application.FullName.ToLowerInvariant()) -or -not $command.Contains('"%1"')) {
            throw "hivra:// registration does not pass the URL to the installed app: $command"
          }
          Write-Host "Hivra registered hivra:// with the installed executable and URL argument"
          Write-Host "Hivra stayed running for 10 seconds after installation"
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hivra-windows-unsigned
          path: apps/desktop/HivraDesktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
