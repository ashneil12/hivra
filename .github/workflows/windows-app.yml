name: Windows app

# Tests and builds Hivra for Windows (apps/windows/HivraDesktop, Tauri) on a
# Windows runner and keeps the unsigned installer as a run artifact. Nothing
# is published from here: a public release needs Windows code signing first.

on:
  pull_request:
    paths:
      - 'apps/windows/**'
      - '.github/workflows/windows-app.yml'
  push:
    branches: [canary]
    paths:
      - 'apps/windows/**'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:
    inputs:
      connection:
        description: 'Website the build opens (blank = https://hivra.cloud/dashboard)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/windows/HivraDesktop/src-tauri
    env:
      CARGO_TERM_COLOR: always
      HIVRA_DESKTOP_CONNECTION: ${{ inputs.connection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Unit tests
        run: cargo test --locked
      - name: Build the installer
        shell: bash
        run: |
          if [ -z "$HIVRA_DESKTOP_CONNECTION" ]; then unset HIVRA_DESKTOP_CONNECTION; fi
          npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hivra-windows-unsigned
          path: apps/windows/HivraDesktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
