name: Launch sweep

# Launches every agent and computer on Canary through the real Launch page, in
# throwaway accounts, and checks each one answers a chat message. See
# dashboard/e2e/launch-sweep.spec.ts. It targets the DEPLOYED Canary, never a
# build of the branch, and never production.
#
# When it runs:
#   - every day at 06:00 UTC;
#   - after a provisioner release lands on canary (waits for the deploy and the
#     hosts' bundle sync first);
#   - on every release pull request into main, as the check to read before
#     promoting;
#   - by hand (Actions > Launch sweep > Run workflow), optionally for a few agents.
on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [canary]
    paths:
      - "dashboard/provisioner-releases/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "Only these (comma-separated profile ids or tile names, e.g. agent-zero,openclaw). Empty = all."
        required: false
        type: string
      keep_failed:
        description: "Keep a failed launch's computer for debugging (reaped later by the cleanup script)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One sweep at a time: Canary has one host. Never cancel a running sweep, or
# its teardown is skipped and computers are left running.
concurrency:
  group: launch-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Launch every agent on Canary
    # Secrets never reach pull requests from forks; skip those instead of failing.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: dashboard
    env:
      LAUNCH_SWEEP_BASE_URL: https://canary.hermesos.cloud
      CLERK_SECRET_KEY: ${{ secrets.CANARY_CLERK_SECRET_KEY }}
      LAUNCH_SWEEP_SUPABASE_URL: ${{ secrets.CANARY_SUPABASE_URL }}
      LAUNCH_SWEEP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CANARY_SUPABASE_SERVICE_ROLE_KEY }}
      LAUNCH_SWEEP_ONLY: ${{ github.event.inputs.only || '' }}
      LAUNCH_SWEEP_KEEP_FAILED: ${{ github.event.inputs.keep_failed == 'true' && '1' || '0' }}
      LAUNCH_SWEEP_WORKERS: "2"
      LAUNCH_SWEEP_RUN_ID: gh${{ github.run_id }}
      # The cleanup script's own names for the same Canary key.
      FIRST_RUN_AUDIT_BASE_URL: https://canary.hermesos.cloud
    steps:
      - name: Check the Canary secrets are set
        run: |
          if [ -z "$CLERK_SECRET_KEY" ] || [ -z "$LAUNCH_SWEEP_SUPABASE_URL" ] || [ -z "$LAUNCH_SWEEP_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Set CANARY_CLERK_SECRET_KEY, CANARY_SUPABASE_URL and CANARY_SUPABASE_SERVICE_ROLE_KEY as repository secrets."
            exit 1
          fi
          case "$CLERK_SECRET_KEY" in sk_test_*) ;; *) echo "::error::CANARY_CLERK_SECRET_KEY must be a test key (sk_test_)."; exit 1 ;; esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for the release to reach Canary's hosts
        if: ${{ github.event_name == 'push' }}
        # Vercel builds the merge (~5 min), then hosts pull the new provisioner
        # bundle on their 10-minute sync.
        run: sleep 1500

      - name: Reap anything an earlier sweep left behind
        run: npm run audit:first-run:cleanup
        continue-on-error: true

      - name: Launch every agent
        id: sweep
        run: npm run test:launch-sweep
        continue-on-error: true

      - name: Results
        if: ${{ always() }}
        run: npm run test:launch-sweep:summary

      - name: Make sure nothing is left running
        if: ${{ always() && env.LAUNCH_SWEEP_KEEP_FAILED != '1' }}
        run: npm run audit:first-run:cleanup -- --min-age-minutes=0 --run-id=${LAUNCH_SWEEP_RUN_ID}

      - name: Upload screenshots and results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launch-sweep-${{ github.run_id }}
          path: dashboard/e2e/.launch-sweep/
          retention-days: 14
          if-no-files-found: ignore
