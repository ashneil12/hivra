# Host ingress directories. Created at boot (and by the install step), never
# cleaned by age, so a proxy restart keeps the nap markers.
# Control socket and the published (key-free) route table: root, readable by the forwarder.
d /run/hivra-ingress 0750 root hivra-ingress -
# The forwarder's own control socket.
d /run/hivra-ingress-fwd 0700 hivra-ingress hivra-ingress -
# Nap markers (napped-<vmid>, holding the QEMU pid): written by root, existence read by the forwarder.
d /run/hivra-ingress-state 0750 root hivra-ingress -
# Route files and per-computer connector env files: root only.
d /etc/hivra/ingress 0700 root root -
d /etc/hivra/ingress/routes 0700 root root -
