[Service]
User=bux
Group=bux
WorkingDirectory=/home/bux
Environment=HOME=/home/bux
Environment=PATH=/home/bux/.npm-global/bin:/home/bux/.bun/bin:/home/bux/.local/bin:/usr/local/bin:/usr/bin:/bin
# Hivra installs and updates the vetted agent CLIs; vendor self-updaters stay off.
Environment=DISABLE_AUTOUPDATER=1
# The terminal listens on a unix socket in a bux-owned 0700 runtime folder, not
# on loopback, so no other local user or service can open this shell as bux.
RuntimeDirectory=hivra-terminal
RuntimeDirectoryMode=0700
ExecStart=
# Session tabs run in persistent tmux sessions that outlive a ttyd restart.
ExecStart=/usr/local/bin/ttyd -i /run/hivra-terminal/ttyd.sock -b /terminal -a -W /usr/local/bin/hivra-agent-shell --agent-terminal
KillMode=process
