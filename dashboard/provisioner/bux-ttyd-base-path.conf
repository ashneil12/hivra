[Service]
User=bux
Group=bux
WorkingDirectory=/home/bux
Environment=HOME=/home/bux
Environment=PATH=/home/bux/.npm-global/bin:/home/bux/.bun/bin:/home/bux/.local/bin:/usr/local/bin:/usr/bin:/bin
# Hivra installs and updates the vetted agent CLIs; vendor self-updaters stay off.
Environment=DISABLE_AUTOUPDATER=1
ExecStart=
# Session tabs run in persistent tmux sessions that outlive a ttyd restart.
ExecStart=/usr/local/bin/ttyd -i lo -p 7681 -b /terminal -a -W /usr/local/bin/hivra-agent-shell --agent-terminal
KillMode=process
