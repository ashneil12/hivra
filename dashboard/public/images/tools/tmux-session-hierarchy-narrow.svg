<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 712" width="320" height="712" role="img" aria-labelledby="t d">
  <title id="t">How tmux nests its parts: server, sessions, windows and panes</title>
  <desc id="d">One tmux server holds sessions. Each session holds windows, and each window is split into panes. Your terminal is a client that attaches to a session and can detach without stopping it. A closed terminal or dropped SSH connection leaves the server running. A sleeping or powered-off machine stops it.</desc>
  <!-- The same diagram as tmux-session-hierarchy.svg, stacked for a phone: drawn at the size it is shown, so its smallest label is 13px. -->
  <style>
    .ui { font-family: system-ui, -apple-system, Helvetica, Arial, sans-serif; font-variant-ligatures: none; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-ligatures: none; }
    .ink { fill: #1a1d20; }
    .muted { fill: #555d63; }
    .accent { fill: #bd342d; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1d20"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="318" height="710" rx="12" fill="#faf9f6" stroke="#c7cbc9" stroke-width="2"/>

  <!-- server -->
  <rect x="10" y="10" width="300" height="456" rx="12" fill="#f1f0eb" stroke="#1a1d20" stroke-width="2.5"/>
  <text x="24" y="38" class="ui ink" font-size="18" font-weight="700">tmux server</text>
  <text x="24" y="58" class="ui muted" font-size="13.5">one per user, runs in the background</text>

  <!-- session: claude -->
  <rect x="22" y="72" width="276" height="232" rx="9" fill="#faf9f6" stroke="#bd342d" stroke-width="2.5"/>
  <text x="36" y="98" class="ui ink" font-size="16" font-weight="700">session: claude</text>

  <rect x="34" y="110" width="252" height="96" rx="7" fill="#f1f0eb" stroke="#c7cbc9" stroke-width="2"/>
  <text x="46" y="132" class="ui muted" font-size="13.5">window 0: agent</text>
  <rect x="46" y="142" width="112" height="48" rx="4" fill="#ffffff" stroke="#1a1d20" stroke-width="2"/>
  <text x="102" y="171" class="mono ink" font-size="13" text-anchor="middle">pane: claude</text>
  <rect x="168" y="142" width="106" height="48" rx="4" fill="#ffffff" stroke="#1a1d20" stroke-width="2"/>
  <text x="221" y="171" class="mono ink" font-size="13" text-anchor="middle">pane: shell</text>

  <rect x="34" y="216" width="252" height="78" rx="7" fill="#f1f0eb" stroke="#c7cbc9" stroke-width="2"/>
  <text x="46" y="238" class="ui muted" font-size="13.5">window 1: logs</text>
  <rect x="46" y="248" width="228" height="34" rx="4" fill="#ffffff" stroke="#1a1d20" stroke-width="2"/>
  <text x="160" y="270" class="mono ink" font-size="13" text-anchor="middle">pane: tail -f</text>

  <!-- session: codex -->
  <rect x="22" y="316" width="276" height="140" rx="9" fill="#faf9f6" stroke="#bd342d" stroke-width="2.5"/>
  <text x="36" y="342" class="ui ink" font-size="16" font-weight="700">session: codex</text>
  <rect x="34" y="354" width="252" height="92" rx="7" fill="#f1f0eb" stroke="#c7cbc9" stroke-width="2"/>
  <text x="46" y="376" class="ui muted" font-size="13.5">window 0: agent</text>
  <rect x="46" y="386" width="112" height="48" rx="4" fill="#ffffff" stroke="#1a1d20" stroke-width="2"/>
  <text x="102" y="415" class="mono ink" font-size="13" text-anchor="middle">pane: codex</text>
  <text x="170" y="406" class="ui muted" font-size="13.5">one session per</text>
  <text x="170" y="426" class="ui muted" font-size="13.5">agent</text>

  <!-- client -->
  <rect x="10" y="500" width="200" height="46" rx="9" fill="#ffffff" stroke="#1a1d20" stroke-width="2.5"/>
  <text x="110" y="529" class="ui ink" font-size="16" font-weight="700" text-anchor="middle">your terminal</text>
  <line x1="52" y1="498" x2="52" y2="472" stroke="#1a1d20" stroke-width="2.5" marker-end="url(#head)"/>
  <line x1="168" y1="472" x2="168" y2="498" stroke="#1a1d20" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#head)"/>
  <text x="10" y="574" class="mono ink" font-size="13">attach: tmux attach -t claude</text>
  <text x="10" y="596" class="mono ink" font-size="13">detach: Ctrl-b d</text>

  <!-- the honest line -->
  <text x="10" y="634" class="ui accent" font-size="14.5" font-weight="600">A closed terminal or dropped SSH</text>
  <text x="10" y="655" class="ui accent" font-size="14.5" font-weight="600">leaves the server running.</text>
  <text x="10" y="683" class="ui accent" font-size="14.5" font-weight="600">A sleeping or powered-off machine</text>
  <text x="10" y="704" class="ui accent" font-size="14.5" font-weight="600">stops it.</text>
</svg>
