# The launch sweep on a schedule. Copy this file to .github/workflows/ in the
# private runner repository (see README.md next to it). It is not a workflow of
# this public repository: the sweep needs Canary admin secrets and launches
# real, billed computers.
#
#   - nightly: a full sweep of whatever Canary serves;
#   - after every Canary merge: a poll every 15 minutes starts a sweep when
#     Canary serves a commit that has no launch-sweep status yet;
#   - by hand: workflow_dispatch, optionally a subset of targets.
#
# Each run records its verdict on the swept commit in ashneil12/hivra as the
# `launch-sweep` commit status, which the pre-Promote gate reads.
name: Launch sweep

on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'LAUNCH_SWEEP_ONLY: comma-separated profile ids (empty = every target)'
        required: false
        default: ''

concurrency:
  group: launch-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pick:
    runs-on: ${{ fromJSON(vars.LAUNCH_SWEEP_RUNS_ON || '["self-hosted","launch-sweep"]') }}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      run: ${{ steps.pick.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ashneil12/hivra
          ref: canary
          sparse-checkout: scripts/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.HIVRA_STATUS_TOKEN }}
        run: |
          sha="$(node scripts/release/launch-sweep-status.mjs served-sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "*/15 * * * *" ]; then
            echo "run=$(node scripts/release/launch-sweep-status.mjs needs-sweep --sha "$sha")" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sweep:
    needs: pick
    if: needs.pick.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.LAUNCH_SWEEP_RUNS_ON || '["self-hosted","launch-sweep"]') }}
    timeout-minutes: 360
    env:
      SHA: ${{ needs.pick.outputs.sha }}
      GITHUB_TOKEN: ${{ secrets.HIVRA_STATUS_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LAUNCH_SWEEP_RUN_ID: gh${{ github.run_id }}
      LAUNCH_SWEEP_OUT_DIR: ${{ github.workspace }}/out
      LAUNCH_SWEEP_VERDICT_FILE: ${{ github.workspace }}/out/verdict.json
      LAUNCH_SWEEP_WORKERS: ${{ vars.LAUNCH_SWEEP_WORKERS || '1' }}
      LAUNCH_SWEEP_ONLY: ${{ inputs.only || '' }}
      CLERK_SECRET_KEY: ${{ secrets.LAUNCH_SWEEP_CLERK_SECRET_KEY }}
      LAUNCH_SWEEP_SUPABASE_URL: ${{ secrets.LAUNCH_SWEEP_SUPABASE_URL }}
      LAUNCH_SWEEP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LAUNCH_SWEEP_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ashneil12/hivra
          ref: ${{ needs.pick.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Mark the commit as being swept
        run: node scripts/release/launch-sweep-status.mjs publish --sha "$SHA" --state pending --description "Sweeping Canary" --target-url "$RUN_URL"
      - name: Install
        working-directory: dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Sweep every Launch tile on Canary
        working-directory: dashboard
        continue-on-error: true
        run: npm run test:launch-sweep
      - name: Summary
        if: always()
        working-directory: dashboard
        continue-on-error: true
        run: npm run test:launch-sweep:summary -- "$LAUNCH_SWEEP_RUN_ID"
      - name: Reap anything a crashed run left
        if: always()
        working-directory: dashboard
        run: npm run audit:first-run:cleanup
      - name: Record the verdict on the commit
        if: always()
        run: |
          if [ -f "$LAUNCH_SWEEP_VERDICT_FILE" ]; then
            node scripts/release/launch-sweep-status.mjs publish --sha "$SHA" --verdict "$LAUNCH_SWEEP_VERDICT_FILE" --target-url "$RUN_URL"
          else
            node scripts/release/launch-sweep-status.mjs publish --sha "$SHA" --state error --description "The sweep wrote no verdict" --target-url "$RUN_URL"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: launch-sweep-${{ needs.pick.outputs.sha }}
          path: out/
          retention-days: 30
