# Per-agent install-and-reply checks. Copy this file to .github/workflows/ in the
# private runner repository, next to launch-sweep.yml (see README.md here).
#
# After every Canary merge (a poll every 15 minutes finds a served commit with
# no agent-checks status), it installs each agent kind that commit changed with
# the real guest installer in a throwaway container on the shared runner box,
# asks it a sum and expects the answer. A commit that changes no agent records
# a green status without installing anything. The `agent-checks` status is
# informational; Promote is gated by the customer path (`launch-sweep`).
name: Agent install checks

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      kinds:
        description: 'Comma-separated agent kinds to check instead of the changed ones (records no status)'
        required: false
        default: ''

concurrency:
  group: agent-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(vars.LAUNCH_SWEEP_RUNS_ON || '["self-hosted","launch-sweep"]') }}
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.HIVRA_STATUS_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      KINDS_INPUT: ${{ inputs.kinds || '' }}
      CHECK_MODEL_KEY: ${{ secrets.AGENT_CHECK_MODEL_KEY }}
      CHECK_MODEL_ORIGIN: ${{ vars.AGENT_CHECK_MODEL_ORIGIN || 'https://canary.hermesos.cloud' }}
      CHECK_MODEL: ${{ vars.AGENT_CHECK_MODEL }}
      CHECK_LOG_DIR: ${{ github.workspace }}/out/agent-checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ashneil12/hivra
          ref: canary
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Pick the commit and the agents it changed
        id: pick
        run: |
          sha="$(node scripts/release/launch-sweep-status.mjs served-sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$KINDS_INPUT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "kinds=$(echo "$KINDS_INPUT" | tr ',' ' ')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=$(node scripts/release/launch-sweep-status.mjs needs-sweep --sha "$sha" --context agent-checks)" >> "$GITHUB_OUTPUT"
          git fetch -q --depth=2 origin "$sha"
          git checkout -q "$sha"
          # A merge into canary: its first parent is canary before the merge.
          echo "kinds=$(node scripts/release/agent-container-check.mjs changed --base "${sha}^1" --head "$sha" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Install and ask each changed agent
        id: check
        if: steps.pick.outputs.run == 'true'
        continue-on-error: true
        env:
          KINDS: ${{ steps.pick.outputs.kinds }}
        run: |
          failed=""
          for kind in $KINDS; do
            ops/agent-container-check/run.sh "$kind" || failed="$failed $kind"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ]
      - name: Record the verdict on the commit
        if: always() && steps.pick.outputs.run == 'true' && env.KINDS_INPUT == ''
        env:
          SHA: ${{ steps.pick.outputs.sha }}
          KINDS: ${{ steps.pick.outputs.kinds }}
          FAILED: ${{ steps.check.outputs.failed }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          publish() { node scripts/release/launch-sweep-status.mjs publish --sha "$SHA" --context agent-checks --target-url "$RUN_URL" "$@"; }
          if [ "$OUTCOME" = "success" ] && [ -z "$KINDS" ]; then
            publish --state success --description "No agent install code changed"
          elif [ "$OUTCOME" = "success" ]; then
            publish --state success --description "Installed and replied: $KINDS"
          else
            publish --state failure --description "Failed: ${FAILED:-the check did not finish}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agent-checks-${{ steps.pick.outputs.sha }}
          path: out/agent-checks/
          retention-days: 30
