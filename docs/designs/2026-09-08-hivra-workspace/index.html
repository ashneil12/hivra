<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Hivra · Workspace design preview</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="assets/icons.js" defer></script>
    <script src="atmosphere.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <canvas class="ambient-network"></canvas>
      <div class="grain"></div>
    </div>
    <a href="#main" class="skip-link">Skip to workspace</a>
    <div class="preview-strip">
      <span class="preview-dot"></span> Design preview
      <span class="strip-divider">/</span> Example data
      <span class="preview-note">No live connections or resource changes</span>
    </div>
    <div id="app" class="app-shell"></div>
    <div id="overlay-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
