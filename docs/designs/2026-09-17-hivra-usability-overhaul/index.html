<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Hivra · Usability overhaul preview</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="assets/icons.js" defer></script>
    <script src="atmosphere.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <canvas class="ambient-network"></canvas>
      <div class="grain"></div>
    </div>
    <a href="#main" class="skip-link">Skip to content</a>

    <div class="preview-strip">
      <span class="preview-dot"></span>
      <span class="preview-label">Redesign preview</span>
      <span class="strip-divider">/</span>
      <span class="preview-note">Example data — nothing here connects to real resources</span>
      <div class="strip-actions">
        <a class="strip-link" href="#home-empty" data-nav>First-run state</a>
        <a class="strip-link" href="#home" data-nav>Returning state</a>
        <button class="strip-button" type="button" data-action="toggle-theme" aria-label="Toggle light and dark theme">
          <span class="theme-icon" data-theme-icon="dark"></span>
          <span class="theme-icon" data-theme-icon="light"></span>
        </button>
      </div>
    </div>

    <div id="app" class="app" data-sidebar="expanded"></div>
    <div id="overlay-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
