# Portable agent memory: Cloudflare Worker + one Durable Object per person
# (CANARY, off by default; nothing links to it until a dashboard flag does).
#
# Each person's memories live in their own object with its own SQLite: text,
# a keyword index and a small vector per memory. Idle objects cost nothing.
# Agents reach it over MCP (POST /mcp) or the plain API (/v1/*) with a key
# minted by Hivra's server; minting is signed with MEMORY_SECRET.
#
# Deploy:  npx wrangler deploy
# Secrets: npx wrangler secret put MEMORY_SECRET   (>= 32 chars)
name = "hivra-memory-canary"
main = "src/index.ts"
compatibility_date = "2024-11-06"
workers_dev = true

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "MEMORY"
class_name = "MemoryStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MemoryStore"]

[vars]
MEMORY_EMBED_MODEL = "@cf/baai/bge-m3"
MEMORY_MAX_ITEMS = "10000"
MEMORY_MAX_TEXT = "4000"
MEMORY_RATE_PER_MINUTE = "120"
# A new memory this close to an older one in the same project is a restatement and replaces it.
# Anything less close is shown to the calling agent, which decides.
MEMORY_REPLACE_ABOVE = "0.97"
